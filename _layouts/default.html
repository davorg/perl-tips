<!doctype html>
<html lang="{{ site.locale | default: 'en-GB' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include seo.html %}
    {% feed_meta %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;display=swap" rel="stylesheet">
    {% include head/custom.html %}
    {% if jekyll.environment == 'production' and site.analytics.google.tracking_id %}
      <script async src="https://www.googletagmanager.com/gtag/js?id={{ site.analytics.google.tracking_id | escape }}"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', {{ site.analytics.google.tracking_id | jsonify }});
      </script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" tabindex="-1">{{ content }}</main>
    {% include footer/custom.html %}
  </body>
</html>
